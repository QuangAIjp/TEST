<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特定技能「工業製品製造業・機械保全」完全ガイド｜社員研修資料</title>
<meta name="description" content="特定技能・機械保全の実務・試験・キャリアパス完全分析。ベトナム人財のための戦略的選択ガイド（社員研修資料）。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --accent:#0b5ed7; --accent-dark:#084298; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                 "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    background: #f4f6fb;
    color: #24292f;
  }
  .site-header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    padding: 32px 20px 28px;
    text-align: center;
  }
  .site-header h1 { margin: 0 0 8px; font-size: clamp(18px, 3.5vw, 26px); line-height: 1.4; }
  .site-header p { margin: 4px 0; opacity: .9; font-size: 14px; }
  .badge {
    display: inline-block; margin-top: 10px; padding: 4px 12px;
    background: rgba(255,255,255,.18); border-radius: 999px; font-size: 12px;
  }
  .toolbar {
    max-width: 980px; margin: 18px auto 0; padding: 0 16px;
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
  }
  .btn {
    cursor: pointer; border: 1px solid #d0d7de; background: #fff; color: var(--accent-dark);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    text-decoration: none; transition: .15s;
  }
  .btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .container {
    max-width: 980px; margin: 14px auto 60px; padding: 0 16px;
  }
  .markdown-body {
    background: #fff; border: 1px solid #d8dee4; border-radius: 14px;
    padding: 38px clamp(18px, 5vw, 56px); box-shadow: 0 6px 24px rgba(13,38,76,.06);
  }
  .markdown-body table { display: table; width: 100%; }
  .markdown-body details { background:#f6f8fa; border:1px solid #d0d7de; border-radius:8px; padding:8px 14px; margin:12px 0; }
  .markdown-body summary { cursor: pointer; font-weight: 600; color: var(--accent-dark); }
  footer { text-align:center; color:#6a737d; font-size:12px; padding: 0 16px 40px; }
  #status { text-align:center; padding:40px; color:#6a737d; }
  @media print {
    .site-header, .toolbar, footer { display:none; }
    body { background:#fff; }
    .markdown-body { border:none; box-shadow:none; padding:0; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <h1>特定技能「工業製品製造業・機械保全」完全ガイド</h1>
    <p>実務・試験・キャリアパス完全分析 ― ベトナム人財のための戦略的選択ガイド</p>
    <span class="badge">社員研修資料</span>
  </header>

  <div class="toolbar">
    <a class="btn" href="特定技能_機械保全_研修資料.md" download>📄 Markdownをダウンロード</a>
    <button class="btn" onclick="window.print()">🖨️ 印刷 / PDF保存</button>
  </div>

  <main class="container">
    <article id="content" class="markdown-body">
      <div id="status">読み込み中…</div>
    </article>
  </main>

  <footer>
    本資料の数値（受入れ枠・合格率・給与等）は作成時点のデータに基づく目安です。最新情報は公式発表（JAIM 等）をご確認ください。
  </footer>

<script>
  const MD_FILE = "特定技能_機械保全_研修資料.md";
  fetch(MD_FILE)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      marked.setOptions({ gfm: true, breaks: false });
      document.getElementById("content").innerHTML = marked.parse(md);
    })
    .catch(err => {
      document.getElementById("status").textContent =
        "資料の読み込みに失敗しました（" + err + "）。Markdownファイルを直接ご確認ください。";
    });
</script>
</body>
</html>
